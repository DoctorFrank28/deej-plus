<!doctype html>
<!--
  Source of docs/images/social-preview.png, the image GitHub shows when the repo link is shared.
  Render it at 1280x640, e.g.:
    playwright-cli open tools/social-preview/index.html
    playwright-cli resize 1280 640
    playwright-cli screenshot --filename=docs/images/social-preview.png
  then upload it in the repo's Settings -> General -> Social preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>deej plus · social preview</title>
<style>
  :root {
    --background: #ffffff;
    --foreground: #0a0a0a;
    --muted: #f5f5f5;
    --muted-foreground: #737373;
    --border: #e5e5e5;
    --primary: #171717;
    --live: #059669;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: var(--background); color: var(--foreground);
    font-family: "Geist", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 560px 1fr; align-items: center;
  }
  .copy { padding: 0 0 0 80px; display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 96px; height: 96px; flex: none; }
  h1 { margin: 0; font-size: 76px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; }
  .tagline { margin: 0; font-size: 30px; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em; }
  .features { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px; }
  .features li {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 19px; font-weight: 500; color: #262626;
  }
  .features li::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--live); }
  .credit { margin: 0; font-size: 18px; color: var(--muted-foreground); }

  .shot {
    position: relative; height: 640px; overflow: hidden;
  }
  .shot img {
    position: absolute; left: 40px; top: 70px; width: 900px;
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, .12), 0 6px 16px rgba(0, 0, 0, .06);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#171717"/><g fill="#fafafa"><rect x="5.75" y="5" width="1.5" height="14" rx=".75" opacity=".4"/><rect x="11.25" y="5" width="1.5" height="14" rx=".75" opacity=".4"/><rect x="16.75" y="5" width="1.5" height="14" rx=".75" opacity=".4"/><rect x="4.2" y="12.43" width="4.6" height="2.5" rx="1.2"/><rect x="9.7" y="6.83" width="4.6" height="2.5" rx="1.2"/><rect x="15.2" y="9.91" width="4.6" height="2.5" rx="1.2"/></g></svg>
      <h1>deej plus</h1>
    </div>
    <p class="tagline">Real sliders for the volume of every app on your Windows PC.</p>
    <ul class="features">
      <li>Auto-reconnect</li>
      <li>Settings window</li>
      <li>Smooth noise filter</li>
      <li>Installer</li>
    </ul>
    <p class="credit">A maintained fork of deej by Omri Harel · MIT</p>
  </div>
  <div class="shot"><img src="../../docs/images/mixer.png" alt=""></div>
</body>
</html>
