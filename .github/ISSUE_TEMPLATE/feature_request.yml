name: Idea or feature request
description: Something deej plus could do, or do better
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Italian are both fine.

  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's missing today, rather than only the solution.
      placeholder: "I switch between headphones and speakers several times a day and..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of a solution, if you have one. Sketches or screenshots are welcome.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Window (mixer, assignments, settings)
        - Connection with the board
        - Sliders and noise filter
        - Arduino sketch
        - Installer and startup
        - Translations
        - Other
